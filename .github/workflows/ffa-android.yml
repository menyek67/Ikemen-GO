name: FFA 2-8 Android Test Build

on:
  push:
    branches:
      - feature/ffa-8p-auto
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply FFA engine patch
        run: |
          python3 build/ffa/apply_engine_patch.py
          gofmt -w src/char.go
          git diff --check

      - name: Verify FFA files
        run: |
          test -f external/mods/ffa8.lua
          test -f external/mods/ffa8.zss
          grep -q 'gameMode == "freeforall"' src/char.go
          grep -q "gameMode('freeforall')" external/script/start.lua
          grep -q 'All Human FFA' external/mods/ffa8.lua
          grep -q 'VS AI FFA' external/mods/ffa8.lua
          grep -q 'All AI FFA' external/mods/ffa8.lua
          grep -q 'Custom FFA' external/mods/ffa8.lua

      - name: Build Android APK
        env:
          APP_VERSION: ffa-8p-auto
          APP_BUILDTIME: ${{ github.run_id }}
          BUILD_ANDROID_APK: '1'
        run: |
          chmod +x build/build_android.sh
          ./build/build_android.sh
          test -f bin/ikemen-go.apk

      - name: Prepare test bundle
        run: |
          mkdir -p ffa-test-build/external/mods
          cp bin/ikemen-go.apk ffa-test-build/
          cp external/mods/ffa8.lua ffa-test-build/external/mods/
          cp external/mods/ffa8.zss ffa-test-build/external/mods/
          cp build/ffa/README.md ffa-test-build/ 2>/dev/null || true
          (cd ffa-test-build && zip -r ../Ikemen_GO-FFA-2-8-Android.zip .)

      - name: Upload FFA Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ikemen_GO-FFA-2-8-Android
          path: Ikemen_GO-FFA-2-8-Android.zip
          if-no-files-found: error
